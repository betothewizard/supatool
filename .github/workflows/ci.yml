name: CI & Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Typecheck & Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Compiler Check
        run: pnpm compile

      - name: Build Extension (Chrome MV3)
        run: pnpm build

      - name: Verify Extension Artifacts
        run: |
          test -f apps/extension/.output/chrome-mv3/manifest.json || { echo "❌ Missing manifest.json"; exit 1; }
          test -f apps/extension/.output/chrome-mv3/background.js || { echo "❌ Missing background.js"; exit 1; }
          test -f apps/extension/.output/chrome-mv3/popup.html || { echo "❌ Missing popup.html"; exit 1; }
          echo "✅ All extension bundles verified successfully."
